<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DrYAE</title>
<link rel="icon" href="/_assets/logo.png">
<link rel="stylesheet" href="/_ui/style.css">
<link rel="stylesheet" href="common.css">
<style>
.doc{max-width:860px;line-height:1.65;font-size:14.5px}
.doc h1{font-size:26px;margin:0 0 10px}.doc h2{font-size:20px;margin:28px 0 8px;padding-top:6px;border-top:1px solid var(--line)}.doc h3{font-size:16px;margin:18px 0 6px}
.doc ul,.doc ol{padding-left:22px}.doc li{margin:3px 0}
.doc code,.doc kbd{font:12.5px Consolas,monospace;background:var(--panel2);padding:1px 5px;border-radius:5px}
.doc img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin:8px 0}
.doc a{color:var(--accent)}
.toc button{all:unset;cursor:pointer;display:block;padding:6px 12px;border-radius:8px;color:var(--muted);font-size:13px}.toc button:hover,.toc button:focus-visible{background:var(--panel3);color:var(--text)}
</style>
</head>
<body>
<header class="ptop" id="top"></header>
<nav class="pnav toc" id="nav" aria-label="Sommaire"></nav>
<main class="pmain" id="main"><div class="pwrap"><div class="row" style="gap:8px;margin-bottom:14px"><button class="btn sm" id="keys">Raccourcis clavier</button><button class="btn sm" id="report">Signaler un problème…</button></div><article class="doc notr" id="doc"></article></div></main>
<script src="/_shared/locales.js"></script>
<script src="/_shared/i18n.js"></script>
<script src="/_shared/a11y.js"></script>
<script src="common.js"></script>
<script src="guide.js"></script>
</body>
</html>
