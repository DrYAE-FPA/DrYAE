<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DrYAE — Navigateur</title>
<link rel="stylesheet" href="../ui/style.css">
<style>
body{display:flex;flex-direction:column;height:100vh}
.tabstrip{display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;background:var(--panel);overflow-x:auto;flex:none}
.tab{display:flex;align-items:center;gap:8px;min-width:120px;max-width:220px;flex:1 1 180px;padding:7px 8px 7px 10px;border-radius:9px 9px 0 0;background:var(--panel2);color:var(--muted);cursor:default;border:1px solid var(--line);border-bottom:0;font-size:12px}
.tab.on{background:var(--bg);color:var(--text)}
.tab.dragging{opacity:.45}
.tab.drop-l{box-shadow:inset 3px 0 0 var(--accent)}
.tab.drop-r{box-shadow:inset -3px 0 0 var(--accent)}
.tab.priv{background:#2a1846}.tab.priv.on{background:#3b2163}
.tab img,.tab .fav{width:14px;height:14px;flex:none;border-radius:3px}
.tab .fav{display:grid;place-items:center;font-size:9px;background:var(--line);color:var(--muted)}
.tab .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .x{padding:2px;border-radius:4px;display:inline-flex;opacity:.6}.tab .x:hover{background:var(--line2);opacity:1}
.tab .x svg{width:12px;height:12px}
.tab.loading .fav{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.newtab{padding:6px 8px;border-radius:8px;color:var(--muted);margin-bottom:3px}.newtab:hover{background:var(--panel2)}
.toolbar{display:flex;align-items:center;gap:4px;padding:6px 8px;background:var(--bg);border-bottom:1px solid var(--line);flex:none}
.addr{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:0 12px;height:34px}
.addr:focus-within{border-color:var(--accent)}
.addr input{flex:1;background:none;border:0;outline:0;padding:0;height:100%}
.addr .lock{color:var(--ok)}.addr .lock.no{color:var(--muted)}
.tb{position:relative;padding:7px;border-radius:8px;color:var(--muted);display:inline-flex}
.tb:hover{background:var(--panel2);color:var(--text)}
.tb.on{color:var(--accent)}
.tb .n{position:absolute;top:0;right:-2px;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center}
.tb .n.on{display:flex}
.tb.shield .n{background:var(--ok)}
.mediabtn{display:none;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--accent);color:#fff;font-weight:600;font-size:12px}
.mediabtn.on{display:inline-flex;animation:pop .3s}
@keyframes pop{from{transform:scale(.8)}to{transform:scale(1)}}
.loadbar{height:2px;background:transparent;flex:none;position:relative;overflow:hidden}
.loadbar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:0;transition:width .3s}
.stage{flex:1;position:relative;display:flex;min-height:0}
.menu.wide{min-width:300px}
.menu button .ml{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu button kbd{font:11px ui-monospace,Consolas,monospace;color:var(--dim);margin-left:12px;white-space:nowrap}
.menu button .mar svg{width:12px;height:12px;color:var(--dim)}
.menu button.mhl{background:linear-gradient(135deg,#f97316,#ec4899 55%,var(--accent));color:#fff;font-weight:700;margin:3px 0;box-shadow:0 2px 10px #ec489955}
.menu button.mhl:hover{filter:brightness(1.1);background:linear-gradient(135deg,#f97316,#ec4899 55%,var(--accent))}
.menu button.mhl svg,.menu button.mhl kbd{color:#fff}
.menu button:disabled{opacity:.4;cursor:default}.menu button:disabled:hover{background:none}
.menu .mback{font-weight:600}
.mzoom{display:flex;align-items:center;gap:6px;padding:4px 10px}
.mzoom span{flex:1}
.mzoom button{width:30px;height:28px;justify-content:center;padding:0;border:1px solid var(--line2);border-radius:6px;font-size:16px}
.mzoom b{min-width:52px;text-align:center;font-size:12px;font-weight:600}
.dtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dtop .check{margin-top:0;font-size:12px}
.dopt{font-size:12px}
.dfile{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2);cursor:pointer;align-items:flex-start}
.dfile:hover{border-color:var(--accent-line)}
.dfile.sel{border-color:var(--accent);background:var(--accent-soft)}
.dfile .ico{width:62px;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;text-align:center}
.dfile .ico svg{width:26px;height:26px;color:var(--text)}
.dfile .ico b{font-size:11.5px;color:var(--text)}
.dfile .mid{flex:1;min-width:0}
.dfile .mid .h{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dfile .mid .n{font-weight:700;font-size:13px;word-break:break-word;margin:2px 0}
.dfile .mid .m{color:var(--muted);font-size:11.5px}.dfile .mid .m b{color:var(--text)}
.dfile .more{padding:4px;border-radius:6px;color:var(--muted)}.dfile .more:hover{background:var(--line)}
.dfile .ck{margin-top:4px;accent-color:var(--accent)}
.pfoot{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.pfoot .sp{flex:1}
.views{flex:1;position:relative}
webview{position:absolute;inset:0;width:100%;height:100%;display:none;background:#fff}
webview.on{display:flex}
.start{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding-top:12vh;overflow:auto;background:var(--bg)}
.start.on{display:flex}
.start img{width:72px;height:72px;border-radius:18px;box-shadow:0 0 40px var(--accent-line)}
.start h1{margin:14px 0 22px;font-size:26px;letter-spacing:.5px}
.start .sbox{width:min(620px,90%);display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line2);border-radius:99px;padding:0 18px;height:48px}
.start .sbox input{flex:1;background:none;border:0;outline:0;font-size:15px}
.start .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;width:min(760px,92%);margin-top:34px}
.start .tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:center;font-size:12px}
.start .tile:hover{border-color:var(--accent)}
.start .tile .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:15px}
.start .tile span{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.start .priv{margin-top:10px;color:#c4b5fd}
.panel{width:380px;border-left:1px solid var(--line);background:var(--panel);display:none;flex-direction:column;min-height:0}
.panel.on{display:flex}
.panel header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel header b{flex:1}
.panel .pbody{flex:1;overflow:auto;padding:10px}
.mitem{padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2)}
.mitem .k{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);margin-right:6px;text-transform:uppercase}
.mitem .k.hls{background:#38bdf822;color:#38bdf8}.mitem .k.audio{background:#34d39922;color:#34d399}.mitem .k.subtitle{background:#e879f922;color:#e879f9}
.mitem .nm{font-weight:600;word-break:break-all;font-size:12px}
.mitem .u{color:var(--muted);font-size:11px;word-break:break-all;margin-top:4px;max-height:32px;overflow:hidden}
.mitem .row{margin-top:8px}
.hrow{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:12px}
.hrow:hover{background:var(--panel2)}
.hrow .t{flex:1;min-width:0}
.hrow .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .t span{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.findbar{position:absolute;top:8px;right:16px;z-index:5;display:none;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px;box-shadow:var(--shadow)}
.findbar.on{display:flex}
.findbar input{width:220px}
.panel{transition:transform .22s ease,opacity .22s ease}
.panel.slide{display:flex;transform:translateX(100%);opacity:0}
.tb.dl .n{background:var(--accent)}
.tb.dl.has{color:var(--accent)}
.pwbar{display:none;align-items:center;gap:10px;padding:8px 14px;background:var(--accent-soft);border-bottom:1px solid var(--accent-line);flex:none}
.pwbar.on{display:flex}
.pwbar span{flex:1}
.pwbar svg{color:var(--accent)}
browser-action-list{display:flex;align-items:center;gap:2px;max-width:40vw;overflow:hidden}
browser-action-list::part(action){width:30px;height:30px;border-radius:8px}
browser-action-list::part(action):hover{background:var(--panel2)}
.zoom{font-size:11px;color:var(--muted);padding:0 4px}
.qsec{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:16px 0 6px;font-weight:600;display:flex;align-items:center;gap:6px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qopt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);text-align:left;cursor:pointer}
.qopt:hover{border-color:var(--accent);background:var(--accent-soft)}
.tfl{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px;margin-bottom:8px}
.tfr{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:12.5px}
.tfr:hover{background:var(--panel2)}
.tfr .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tfr .s{color:var(--muted);font-variant-numeric:tabular-nums}
.qopt b{font-size:13px}.qopt span{color:var(--muted);font-size:11px}
.qopt.best{border-color:var(--accent-line)}
.bmbar{display:none;align-items:center;gap:2px;padding:3px 8px;background:var(--bg);border-bottom:1px solid var(--line);flex:none;min-height:30px;overflow:hidden}
.bmbar.on{display:flex}
.bmbar .bi{display:inline-flex;align-items:center;gap:6px;max-width:170px;padding:4px 8px;border-radius:7px;color:var(--muted);font-size:12px;white-space:nowrap}
.bmbar .bi:hover{background:var(--panel2);color:var(--text)}
.bmbar .bi span{overflow:hidden;text-overflow:ellipsis}
.bmbar .bi img,.bmbar .bi svg{width:14px;height:14px;flex:none;border-radius:3px}
.bmbar .bi.drop-l{box-shadow:inset 2px 0 0 var(--accent)}.bmbar .bi.drop-r{box-shadow:inset -2px 0 0 var(--accent)}
.bmbar .sp{flex:1}
.bmbar .empty{color:var(--dim);font-size:11.5px;padding:0 6px}
.trbar{display:none;align-items:center;gap:10px;padding:6px 14px;background:var(--panel2);border-bottom:1px solid var(--line);flex:none;font-size:12.5px}
.trbar.on{display:flex}
.trbar svg{color:var(--accent)}
.trbar span{flex:1}
.tb.upd{color:#fff;background:var(--ok);display:none}.tb.upd.on{display:inline-flex}.tb.upd:hover{filter:brightness(1.1);background:var(--ok);color:#fff}
.tb.upd .dot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
.tb.mod.act{color:var(--accent);background:var(--accent-soft)}
.tb.nd{display:none}.tb.nd.on{display:inline-flex}
.tb.nd .ring{position:absolute;inset:3px;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);animation:spin 1s linear infinite;display:none}.tb.nd.busy .ring{display:block}
.menu .mtitle{padding:8px 12px 3px;font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);font-weight:600}
.menu button .mck{width:16px;color:var(--accent)}
.menu button img.mfav{width:16px;height:16px;border-radius:3px;flex:none}
.bmedit{position:fixed;z-index:30;width:320px;display:none;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:14px}
.bmedit.on{display:block}
.bmedit h4{margin:0 0 10px;font-size:14px}
.bmedit label{display:block;font-size:11.5px;color:var(--muted);margin:8px 0 4px}
.bmedit input,.bmedit select{width:100%}
.bmedit .row{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}
.nditem{padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel2)}
.nditem .n{font-weight:600;word-break:break-all;font-size:12.5px}
.nditem .s{color:var(--muted);font-size:11.5px;margin:3px 0 6px}
.nditem .bar{height:4px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:6px}.nditem .bar i{display:block;height:100%;background:var(--accent)}
.nditem .row{display:flex;gap:4px;flex-wrap:wrap}
.lock.int{color:var(--accent)!important}
.spin{width:22px;height:22px;border:3px solid var(--line2);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:18px auto}

/* 1.6.5 : fenêtres de la barre d'outils (extensions, traducteur, scans, lumières, bloqueur) */
.pop{position:fixed;z-index:45;display:none;width:350px;max-height:calc(100vh - 100px);overflow:auto;background:var(--panel3);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:12px;font-size:13px}
.pop.on{display:block}
.pop .ph{display:flex;align-items:center;gap:8px;margin:-2px 0 10px}
.pop .ph b{flex:1;font-size:14px}
.pop .ph svg,.pop .prow svg{width:16px;height:16px}
.pop .psec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--dim);margin:12px 2px 6px}
.pop .prow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;min-height:36px}
.pop .prow:hover{background:var(--panel2)}
.pop .prow .grow{flex:1;min-width:0}
.pop .prow .grow small{display:block;color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .prow .nm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .prow img,.pop .prow .xi{width:20px;height:20px;border-radius:4px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--line);color:var(--muted)}
.pop .prow .xi svg{width:16px;height:16px}
.pop .prow.clk{cursor:pointer}
.pop .pin{padding:5px;border-radius:7px;color:var(--dim);display:inline-flex}
.pop .pin:hover{background:var(--line);color:var(--text)}
.pop .pin.on{color:var(--accent)}
.pop .pfoot{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.pop .pfoot .btn{flex:1;justify-content:center}
.pop textarea{min-height:70px;resize:vertical;font:inherit}
.pop .pout{min-height:54px;max-height:220px;overflow:auto;white-space:pre-wrap;padding:9px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);margin-top:8px}
.pop .pout.dim{color:var(--dim)}
.pop .pmeta{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--dim);font-size:11px}
.pop .pmeta span{flex:1}
.pop select{width:auto;max-width:170px;padding:5px 8px}
.pop input[type=range]{flex:1;accent-color:var(--accent)}
.pop input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:6px;background:none;padding:1px}
.pop .big{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.pop .big .pw{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--dim);flex:none}
.pop .big .pw.on{background:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.pop .big .pw svg{width:22px;height:22px}
.pop .nums{display:flex;gap:8px;margin-top:8px}
.pop .nums div{flex:1;padding:8px;border-radius:10px;background:var(--panel2);text-align:center}
.pop .nums b{display:block;font-size:18px}
.pop .nums small{color:var(--dim);font-size:11px}
.pop .seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.pop .seg button{flex:1;padding:7px 4px;font-size:12px;color:var(--muted)}
.pop .seg button.on{background:var(--accent);color:#fff;font-weight:600}
.pop .tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pop .tools button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.pop .tools button:hover{color:var(--text);border-color:var(--line2)}
.pop .tools button.on{color:var(--accent);border-color:var(--accent-line)}
.pop .tools svg{width:18px;height:18px}
.pop .tg{position:relative;width:34px;height:20px;border-radius:99px;background:var(--line2);flex:none;transition:background .15s;cursor:pointer}
.pop .tg::after{content:'';position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.pop .tg.on{background:var(--accent)}.pop .tg.on::after{left:17px}
.tb.ext{width:32px;height:32px;padding:0;background-position:center;background-repeat:no-repeat;background-size:18px;border:0}
.tb.ext.no-icon::after{content:attr(data-letter);text-transform:uppercase;font-size:11px;font-weight:700;background:var(--line2);color:var(--text);border-radius:5px;width:20px;height:20px;display:grid;place-items:center;margin:auto}
.tb.ext .badge{position:absolute;bottom:1px;right:0;height:12px;padding:0 2px;border-radius:3px;font-size:9px;line-height:12px;pointer-events:none}

.bmdlg{position:fixed;inset:0;z-index:50;background:#0007;display:none;align-items:center;justify-content:center}
.bmdlg.on{display:flex}
.bmdlg .box{width:min(520px,92vw);background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);padding:18px}
.bmdlg h4{margin:0 0 8px;font-size:15px}
.bmdlg label{display:block;font-size:11.5px;color:var(--muted);margin:10px 0 4px}
.bmdlg .tree{margin-top:12px;height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:4px}
.bmdlg .tn{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;user-select:none}
.bmdlg .tn:hover{background:var(--panel2)}
.bmdlg .tn.on{background:var(--accent-soft);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent-line)}
.bmdlg .tn .tw{width:14px;display:inline-flex;color:var(--dim)}
.bmdlg .tn svg{width:15px;height:15px}
.bmdlg .tn input{padding:3px 6px;height:auto}
.bmdlg .row{display:flex;gap:6px;margin-top:14px}
</style>
</head>
<body>
<svg style="display:none">
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-reload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></symbol>
