<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Lecteur DrYAE</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font:13px "Segoe UI",sans-serif;overflow:hidden}
video{width:100%;height:100%;background:#000;outline:0}
#msg{position:fixed;top:12px;left:12px;background:#000a;padding:6px 10px;border-radius:6px;pointer-events:none;transition:opacity .4s}
#sp{position:fixed;top:12px;right:12px;display:flex;align-items:center;gap:6px;background:#000b;padding:4px 8px;border-radius:8px;opacity:0;transition:opacity .3s}
body:hover #sp,#sp:focus-within{opacity:1}
#sp select{background:#1b1f2a;color:#eee;border:1px solid #444;border-radius:6px;padding:2px 4px;font:13px "Segoe UI",sans-serif}
</style></head><body>
<video id="v" controls autoplay></video><div id="msg"></div><label id="sp"><span id="spL"></span><select id="spS"></select></label>
<script>
const q = new URLSearchParams(location.search), v = document.getElementById('v'), m = document.getElementById('msg');
document.title = (q.get('title') || q.get('lp') || 'DrYAE') + ' — DrYAE';
m.textContent = q.get('title') || '';
v.src = q.get('src');
// vitesse de lecture (0,5× à 3×), gardée pour les prochaines vidéos ; touches < et > pour changer
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2, 2.5, 3], S = document.getElementById('spS');
document.getElementById('spL').textContent = q.get('sp') || 'Vitesse';
let rate = 1; try { rate = +localStorage.getItem('dryae-player-rate') || 1; } catch {}
S.innerHTML = SPEEDS.map(r => `<option value="${r}">× ${r.toLocaleString(document.documentElement.lang)}</option>`).join('');
const setRate = r => { rate = SPEEDS.includes(r) ? r : 1; v.playbackRate = rate; v.defaultPlaybackRate = rate; S.value = rate; try { localStorage.setItem('dryae-player-rate', rate); } catch {} };
S.onchange = () => { setRate(+S.value); v.focus(); };
v.addEventListener('loadedmetadata', () => setRate(rate));
setRate(rate);
setTimeout(() => (m.style.opacity = 0), 3500);
v.addEventListener('error', () => { m.style.opacity = 1; m.textContent = q.get('err') || 'Lecture impossible'; });
v.addEventListener('waiting', () => { m.style.opacity = 1; m.textContent = q.get('buf') || '…'; });
v.addEventListener('playing', () => (m.style.opacity = 0));
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  if (e.key === 'ArrowRight') v.currentTime += 10;
  if (e.key === 'ArrowLeft') v.currentTime -= 10;
  if (e.key.toLowerCase() === 'f') document.fullscreenElement ? document.exitFullscreen() : v.requestFullscreen();
  if (e.key === '>' || e.key === '<') { const i = SPEEDS.indexOf(rate) + (e.key === '>' ? 1 : -1); if (SPEEDS[i]) { setRate(SPEEDS[i]); m.style.opacity = 1; m.textContent = '× ' + rate.toLocaleString(document.documentElement.lang); clearTimeout(m.t); m.t = setTimeout(() => (m.style.opacity = 0), 1200); } }
});
</script></body></html>
