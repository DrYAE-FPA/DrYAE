# Vidéos de démonstration de DrYAE (lancé à la main) : DrYAE filmé sur un écran virtuel, vraies traductions.
name: Vidéos de démonstration
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  videos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Outils (écran virtuel, ffmpeg, polices)
        run: sudo apt-get update && sudo apt-get install -y xvfb ffmpeg fonts-noto-cjk fonts-dejavu
      - run: npm ci
      - run: npm i --no-save playwright@1.63.0
      - run: node node_modules/electron/install.js
      - run: node tools/build-locales.js
      - name: Tournage
        run: xvfb-run -a -s "-screen 0 1280x800x24" node tools/demo/record.js
      - name: Vidéos ajoutées au site (docs/videos)
        run: |
          mkdir -p docs/videos
          cp dist/demo/*.mp4 docs/videos/
          cp dist/demo/traducteur-de-scans.gif docs/images/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/videos docs/images
          git commit -m "Vidéos de démonstration mises à jour" || exit 0
          git push
