# Étiquette automatique des signalements envoyés depuis DrYAE : le titre commence par « [R-XXXX] [Section] ».
name: Étiquettes des signalements
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const t = context.payload.issue.title || '';
            const m = t.match(/^\[R-[0-9A-F]{4}\]\s*\[([^\]]+)\]/i);
            if (!m) return;
            const map = { 'téléchargements': 'téléchargements', 'navigateur': 'navigateur', 'torrents': 'torrents', 'traducteur de scans': 'traducteur de scans', 'lecteur vidéo': 'lecteur vidéo', 'mises à jour': 'mises à jour', 'autre': 'autre' };
            const name = map[m[1].trim().toLowerCase()];
            if (!name) return;
            await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, labels: [name, 'depuis DrYAE'] });
