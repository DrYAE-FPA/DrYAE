name: Mauvaise traduction (scans) / Wrong translation (scans)
description: Une bulle mal lue ou mal traduite par le Traducteur de scans — A bubble misread or mistranslated
labels: [traduction]
body:
  - type: markdown
    attributes:
      value: |
        Préparé par DrYAE (« Signaler cette traduction »). Écrivez la bonne traduction, puis cliquez sur « Create ».
        Prepared by DrYAE ("Report this translation"). Write the right translation, then click "Create".
  - type: textarea
    id: what
    attributes: { label: "Texte lu et traduction / Text read and translation" }
  - type: input
    id: version
    attributes: { label: "Version de DrYAE / DrYAE version" }
  - type: input
    id: windows
    attributes: { label: "Version de Windows / Windows version" }
