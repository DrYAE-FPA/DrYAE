<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--bg:#0d0f14;--panel:#13161d;--panel2:#191d26;--line:#232836;--text:#e7e9ef;--muted:#8a91a3;--accent:#8b5cf6;--ok:#22c55e;--err:#ef4444}
@media (prefers-color-scheme: light){:root{--bg:#f5f6fa;--panel:#fff;--panel2:#f0f2f7;--line:#e1e4ec;--text:#151821;--muted:#5d6475}}
body{margin:0;width:340px;background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
header img{width:30px;height:30px;border-radius:8px}
header b{font-size:15px;flex:1}
.st{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.st.on{color:var(--ok);border-color:#22c55e66}.st.off{color:var(--err);border-color:#ef444466}
main{padding:12px 14px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:600;width:100%}
button.sec{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:500;width:auto;padding:5px 10px;font-size:12px}
label{display:flex;align-items:center;gap:8px;margin:12px 0;cursor:pointer}
input{accent-color:var(--accent)}
.m{padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:8px;background:var(--panel)}
.m .n{font-weight:600;word-break:break-all;font-size:12px}
.m .u{color:var(--muted);font-size:11px;margin:3px 0 6px}
.k{font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;background:#8b5cf622;color:var(--accent);margin-right:6px;text-transform:uppercase}
.hint{color:var(--muted);font-size:12px}
h4{margin:14px 0 2px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
</style></head>
<body>
<header><img src="icons/48.png" alt=""><b>DrYAE</b><span class="st" id="st">…</span></header>
<main>
  <div id="off" class="hint" style="display:none;margin-bottom:10px"><span data-i="offHint"></span></div>
  <button id="page"><span data-i="pageBtn"></span></button>
  <label><input type="checkbox" id="intercept"> <span data-i="intercept"></span></label>
  <h4><span data-i="detected"></span></h4>
  <div id="list"><p class="hint"><span data-i="playHint"></span></p></div>
</main>
<script src="popup.js"></script>
</body></html>
